<rect width="1200" height="1490" fill="#f2f6fa"/>
<text x="40" y="65" font-family="Noto Sans Thai,Tahoma,sans-serif" font-size="34" font-weight="700" fill="#123d68">วิธีตรวจสอบตำแหน่งแมกกาซีน — ภาพอธิบายหลักการ</text>
<g transform="translate(30,130)"><rect width="560" height="410" rx="18" fill="#fff" stroke="#b7c7d8" stroke-width="3"/><path d="M18 0H542Q560 0 560 18V58H0V18Q0 0 18 0Z" fill="#123d68"/><text x="22" y="27" class="head">1. Gray Code</text><text x="22" y="49" class="sub">รหัสเกรย์</text><g transform="translate(0,60)"><g><text x="32" y="48" class="label">ตัวอย่าง Gray sequence 3 บิต</text><g transform="translate(35,90)"><circle cx="18" cy="0" r="15" fill="#fff" stroke="#24415f" stroke-width="2"/><text x="18" y="5" text-anchor="middle" class="bit">000</text><text x="18" y="35" text-anchor="middle" class="tiny">1</text></g><g transform="translate(93,90)"><circle cx="18" cy="0" r="15" fill="#dbeafe" stroke="#24415f" stroke-width="2"/><text x="18" y="5" text-anchor="middle" class="bit">001</text><text x="18" y="35" text-anchor="middle" class="tiny">2</text></g><g transform="translate(151,90)"><circle cx="18" cy="0" r="15" fill="#fff" stroke="#24415f" stroke-width="2"/><text x="18" y="5" text-anchor="middle" class="bit">011</text><text x="18" y="35" text-anchor="middle" class="tiny">3</text></g><g transform="translate(209,90)"><circle cx="18" cy="0" r="15" fill="#dbeafe" stroke="#24415f" stroke-width="2"/><text x="18" y="5" text-anchor="middle" class="bit">010</text><text x="18" y="35" text-anchor="middle" class="tiny">4</text></g><g transform="translate(267,90)"><circle cx="18" cy="0" r="15" fill="#fff" stroke="#24415f" stroke-width="2"/><text x="18" y="5" text-anchor="middle" class="bit">110</text><text x="18" y="35" text-anchor="middle" class="tiny">5</text></g><g transform="translate(325,90)"><circle cx="18" cy="0" r="15" fill="#dbeafe" stroke="#24415f" stroke-width="2"/><text x="18" y="5" text-anchor="middle" class="bit">111</text><text x="18" y="35" text-anchor="middle" class="tiny">6</text></g><g transform="translate(383,90)"><circle cx="18" cy="0" r="15" fill="#fff" stroke="#24415f" stroke-width="2"/><text x="18" y="5" text-anchor="middle" class="bit">101</text><text x="18" y="35" text-anchor="middle" class="tiny">7</text></g><g transform="translate(441,90)"><circle cx="18" cy="0" r="15" fill="#dbeafe" stroke="#24415f" stroke-width="2"/><text x="18" y="5" text-anchor="middle" class="bit">100</text><text x="18" y="35" text-anchor="middle" class="tiny">8</text></g><text x="32" y="158" class="small">ตำแหน่งติดกันเปลี่ยนสถานะเพียง 1 บิต</text><path d="M40 180H490" stroke="#d6e0ea" stroke-width="2"/><text x="32" y="214" class="small">ต้องมีหัวอ่านหลายแทร็กและตรวจรหัสที่เสถียรก่อนยืนยันตำแหน่ง</text></g></g></g><g transform="translate(620,130)"><rect width="560" height="410" rx="18" fill="#fff" stroke="#b7c7d8" stroke-width="3"/><path d="M18 0H542Q560 0 560 18V58H0V18Q0 0 18 0Z" fill="#123d68"/><text x="22" y="27" class="head">2. Binary / BCD</text><text x="22" y="49" class="sub">รหัสไบนารี / BCD</text><g transform="translate(0,60)"><g><text x="32" y="48" class="label">รหัส Binary / BCD จากหลายแทร็ก</text><g><text x="36" y="95" class="small">บิต 3</text><rect x="112" y="72" width="360" height="22" rx="4" fill="#e2e8f0" stroke="#64748b"/><path d="M160 72V94 M208 72V94 M256 72V94 M304 72V94 M352 72V94 M400 72V94" stroke="#64748b" stroke-width="2"/></g><g><text x="36" y="130" class="small">บิต 2</text><rect x="112" y="107" width="360" height="22" rx="4" fill="#dbeafe" stroke="#64748b"/><path d="M160 107V94 M208 107V94 M256 107V94 M304 107V94 M352 107V94 M400 107V94" stroke="#64748b" stroke-width="2"/></g><g><text x="36" y="165" class="small">บิต 1</text><rect x="112" y="142" width="360" height="22" rx="4" fill="#e2e8f0" stroke="#64748b"/><path d="M160 142V94 M208 142V94 M256 142V94 M304 142V94 M352 142V94 M400 142V94" stroke="#64748b" stroke-width="2"/></g><g><text x="36" y="200" class="small">บิต 0</text><rect x="112" y="177" width="360" height="22" rx="4" fill="#dbeafe" stroke="#64748b"/><path d="M160 177V94 M208 177V94 M256 177V94 M304 177V94 M352 177V94 M400 177V94" stroke="#64748b" stroke-width="2"/></g><text x="32" y="244" class="small">Binary ใช้ n บิตแทนได้สูงสุด 2ⁿ รหัส</text><text x="32" y="272" class="small">BCD ใช้ 4 บิตต่อเลขฐานสิบหนึ่งหลัก</text></g></g></g><g transform="translate(30,570)"><rect width="560" height="410" rx="18" fill="#fff" stroke="#b7c7d8" stroke-width="3"/><path d="M18 0H542Q560 0 560 18V58H0V18Q0 0 18 0Z" fill="#123d68"/><text x="22" y="27" class="head">3. Single Sensor per Pocket</text><text x="22" y="49" class="sub">เซ็นเซอร์แยกประจำทุกช่อง</text><g transform="translate(0,60)"><g><text x="32" y="48" class="label">มีเซ็นเซอร์ประจำแต่ละ Pocket</text><circle cx="275" cy="170" r="108" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/><circle cx="275" cy="170" r="45" fill="#dbe5ef" stroke="#24415f" stroke-width="3"/><g><circle cx="360" cy="170" r="18" fill="#dbeafe" stroke="#24415f" stroke-width="2"/><circle cx="360" cy="170" r="6" fill="#16a34a"/></g><g><circle cx="348.61215932167727" cy="212.5" r="18" fill="#dbeafe" stroke="#24415f" stroke-width="2"/><circle cx="348.61215932167727" cy="212.5" r="6" fill="#16a34a"/></g><g><circle cx="317.5" cy="243.61215932167727" r="18" fill="#dbeafe" stroke="#24415f" stroke-width="2"/><circle cx="317.5" cy="243.61215932167727" r="6" fill="#16a34a"/></g><g><circle cx="275" cy="255" r="18" fill="#dbeafe" stroke="#24415f" stroke-width="2"/><circle cx="275" cy="255" r="6" fill="#16a34a"/></g><g><circle cx="232.50000000000003" cy="243.6121593216773" r="18" fill="#dbeafe" stroke="#24415f" stroke-width="2"/><circle cx="232.50000000000003" cy="243.6121593216773" r="6" fill="#16a34a"/></g><g><circle cx="201.3878406783227" cy="212.5" r="18" fill="#dbeafe" stroke="#24415f" stroke-width="2"/><circle cx="201.3878406783227" cy="212.5" r="6" fill="#16a34a"/></g><g><circle cx="190" cy="170" r="18" fill="#dbeafe" stroke="#24415f" stroke-width="2"/><circle cx="190" cy="170" r="6" fill="#16a34a"/></g><g><circle cx="201.3878406783227" cy="127.50000000000003" r="18" fill="#dbeafe" stroke="#24415f" stroke-width="2"/><circle cx="201.3878406783227" cy="127.50000000000003" r="6" fill="#16a34a"/></g><g><circle cx="232.49999999999997" cy="96.38784067832273" r="18" fill="#dbeafe" stroke="#24415f" stroke-width="2"/><circle cx="232.49999999999997" cy="96.38784067832273" r="6" fill="#16a34a"/></g><g><circle cx="275" cy="85" r="18" fill="#dbeafe" stroke="#24415f" stroke-width="2"/><circle cx="275" cy="85" r="6" fill="#16a34a"/></g><g><circle cx="317.5" cy="96.38784067832272" r="18" fill="#dbeafe" stroke="#24415f" stroke-width="2"/><circle cx="317.5" cy="96.38784067832272" r="6" fill="#16a34a"/></g><g><circle cx="348.61215932167727" cy="127.49999999999997" r="18" fill="#dbeafe" stroke="#24415f" stroke-width="2"/><circle cx="348.61215932167727" cy="127.49999999999997" r="6" fill="#16a34a"/></g><text x="275" y="312" text-anchor="middle" class="small">ยืนยันช่องได้โดยตรง แต่ใช้ DI และสายจำนวนมาก</text></g></g></g><g transform="translate(620,570)"><rect width="560" height="410" rx="18" fill="#fff" stroke="#b7c7d8" stroke-width="3"/><path d="M18 0H542Q560 0 560 18V58H0V18Q0 0 18 0Z" fill="#123d68"/><text x="22" y="27" class="head">4. Home + Index Sensor</text><text x="22" y="49" class="sub">เซ็นเซอร์ Home และ Index</text><g transform="translate(0,60)"><g><text x="32" y="48" class="label">Home เป็นจุดอ้างอิง และ Index เป็นสัญญาณนับ</text><circle cx="180" cy="170" r="108" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/><circle cx="180" cy="170" r="48" fill="#dbe5ef" stroke="#24415f" stroke-width="3"/><path d="M180 62V32" stroke="#dc2626" stroke-width="8"/><rect x="154" y="22" width="52" height="22" rx="5" fill="#fecaca" stroke="#991b1b" stroke-width="2"/><path d="M288 170H325" stroke="#16a34a" stroke-width="7"/><rect x="320" y="150" width="24" height="40" rx="4" fill="#bbf7d0" stroke="#166534" stroke-width="2"/><text x="350" y="160" class="small">HOME</text><text x="350" y="185" class="small">INDEX</text><text x="32" y="312" class="small">ต้องกำหนดว่าพัลส์ Index เกิดต่อ Pocket หรือต่อรอบ</text></g></g></g><g transform="translate(30,1010)"><rect width="560" height="410" rx="18" fill="#fff" stroke="#b7c7d8" stroke-width="3"/><path d="M18 0H542Q560 0 560 18V58H0V18Q0 0 18 0Z" fill="#123d68"/><text x="22" y="27" class="head">5. Encoder / Step Counts</text><text x="22" y="49" class="sub">เอ็นโคเดอร์ / การนับสเต็ป</text><g transform="translate(0,60)"><g><text x="32" y="48" class="label">Incremental Encoder: สัญญาณ A/B และการนับ</text><circle cx="90" cy="142" r="43" fill="#dbe5ef" stroke="#24415f" stroke-width="4"/><circle cx="90" cy="142" r="14" fill="#94a3b8" stroke="#24415f" stroke-width="3"/><path d="M90 99V82" stroke="#24415f" stroke-width="8"/><text x="150" y="100" class="small">A</text><text x="150" y="170" class="small">B</text><path d="M180 95H215V65H250V95H285V65H320V95H355V65H390V95H450" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M180 165H198V135H233V165H268V135H303V165H338V135H373V165H450" fill="none" stroke="#16a34a" stroke-width="4"/><text x="32" y="245" class="small">A/B ใช้ระบุจำนวนและทิศทาง; Z อาจใช้เป็น index reference</text><text x="32" y="274" class="small">Step count แบบ open-loop คือจำนวนคำสั่ง ไม่ใช่ feedback จริง</text></g></g></g><g transform="translate(620,1010)"><rect width="560" height="410" rx="18" fill="#fff" stroke="#b7c7d8" stroke-width="3"/><path d="M18 0H542Q560 0 560 18V58H0V18Q0 0 18 0Z" fill="#123d68"/><text x="22" y="27" class="head">6. Absolute Encoder</text><text x="22" y="49" class="sub">เอ็นโคเดอร์แบบ Absolute</text><g transform="translate(0,60)"><g><text x="32" y="48" class="label">Absolute Encoder: อ่านรหัสตำแหน่งโดยตรง</text><circle cx="165" cy="170" r="112" fill="#dbe5ef" stroke="#24415f" stroke-width="4"/><circle cx="165" cy="170" r="82" fill="none" stroke="#64748b" stroke-width="13" stroke-dasharray="18 8"/><circle cx="165" cy="170" r="54" fill="none" stroke="#2563eb" stroke-width="11" stroke-dasharray="12 8"/><circle cx="165" cy="170" r="25" fill="#94a3b8" stroke="#24415f" stroke-width="3"/><path d="M260 100L320 70" stroke="#24415f" stroke-width="4"/><rect x="318" y="45" width="165" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="400" y="75" text-anchor="middle" class="bit">SSI / BiSS</text><text x="400" y="102" text-anchor="middle" class="bit">EnDat / Fieldbus</text><text x="32" y="312" class="small">ต้องตรวจชนิด Single-turn / Multi-turn และการต่อกับระบบควบคุม</text></g></g></g>
<text x="40" y="1470" class="small">หมายเหตุ: ต้องตรวจสัญญาณกับวงจรจริงและยืนยันตำแหน่งเมื่อกลไกหยุดนิ่งตามข้อกำหนดของแต่ละวิธี</text>
</svg>